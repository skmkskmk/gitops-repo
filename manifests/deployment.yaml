apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hello-app

  template:
    metadata:
      labels:
        app: hello-app

    spec:
      containers:
      - name: hello-app
        image: 205930613179.dkr.ecr.ap-south-1.amazonaws.com/hello-app:v2

        ports:
        - containerPort: 3000